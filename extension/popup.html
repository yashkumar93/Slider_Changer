<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides Remote</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --bg-0: #141519;
      --bg-1: #1b1d23;
      --panel: #1f222a;
      --screen: #16181d;
      --text: #f1efe9;
      --text-dim: #8d8f98;
      --text-dimmer: #5c5e66;
      --accent: #e3a24b;
      --accent-dim: #8a6a37;
      --success: #57d38c;
      --success-dim: rgba(87, 211, 140, 0.14);
      --error: #ff4b4b;
      --error-dim: rgba(255, 75, 75, 0.14);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 9px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 900px 600px at 50% -10%, rgba(227, 162, 75, 0.08), transparent 60%),
        radial-gradient(ellipse 700px 500px at 85% 100%, rgba(87, 211, 140, 0.05), transparent 60%),
        var(--bg-0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 360px;
      /* Force extension width */
    }

    .stage {
      width: 100%;
      max-width: 420px;
    }

    .device {
      position: relative;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--panel) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 26px 24px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.05) inset,
        0 30px 60px -20px rgba(0, 0, 0, 0.6),
        0 10px 24px -12px rgba(0, 0, 0, 0.5);
    }

    .device::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14%;
      right: 14%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      border-radius: 100%;
    }

    /* header */
    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .mark {
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 10px;
      background: linear-gradient(155deg, #2b2e37, #1a1c22);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mark svg {
      width: 19px;
      height: 19px;
    }

    .head h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.01em;
    }

    .head p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--text-dim);
      font-weight: 400;
    }

    /* status row */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--screen);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-dim);
      flex: none;
    }

    .led.off {
      background: var(--error);
      box-shadow: 0 0 0 3px var(--error-dim);
      animation: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      .led:not(.off) {
        animation: breathe 2.6s ease-in-out infinite;
      }
    }

    @keyframes breathe {

      0%,
      100% {
        box-shadow: 0 0 0 3px var(--success-dim);
        opacity: 1;
      }

      50% {
        box-shadow: 0 0 0 6px transparent;
        opacity: 0.75;
      }
    }

    .status-left span {
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
    }

    .badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--success);
      background: var(--success-dim);
      padding: 4px 9px;
      border-radius: 100px;
      border: 1px solid rgba(87, 211, 140, 0.25);
      white-space: nowrap;
    }

    /* address panel */
    .field-label {
      font-size: 12px;
      color: var(--text-dim);
      margin: 0 0 7px 2px;
      font-weight: 400;
    }

    .address {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--screen);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      margin-bottom: 22px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .address.hidden {
      display: none;
    }

    .address:hover {
      border-color: var(--border-strong);
    }

    .address code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      color: var(--accent);
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
    }

    .address svg {
      width: 15px;
      height: 15px;
      color: var(--text-dimmer);
      flex: none;
    }

    /* scan area */
    .scan {
      position: relative;
      width: 184px;
      height: 184px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan.hidden,
    .scan-caption.hidden {
      display: none;
    }

    .scan-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--accent);
      opacity: 0.85;
    }

    .scan-corner.tl {
      top: 0;
      left: 0;
      border-top: 2px solid;
      border-left: 2px solid;
      border-radius: 6px 0 0 0;
    }

    .scan-corner.tr {
      top: 0;
      right: 0;
      border-top: 2px solid;
      border-right: 2px solid;
      border-radius: 0 6px 0 0;
    }

    .scan-corner.bl {
      bottom: 0;
      left: 0;
      border-bottom: 2px solid;
      border-left: 2px solid;
      border-radius: 0 0 0 6px;
    }

    .scan-corner.br {
      bottom: 0;
      right: 0;
      border-bottom: 2px solid;
      border-right: 2px solid;
      border-radius: 0 0 6px 0;
    }

    #qrcode {
      width: 148px;
      height: 148px;
      padding: 9px;
      background: #f1efe9;
      border-radius: 10px;
    }

    #qrcode img {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .scan-caption {
      text-align: center;
      font-size: 12.5px;
      color: var(--text-dim);
      margin: 0 0 22px;
      line-height: 1.5;
    }

    /* button */
    .copy-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #1c1509;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.05s ease;
    }

    .copy-btn.hidden {
      display: none;
    }

    .copy-btn:hover {
      filter: brightness(1.08);
    }

    .copy-btn:active {
      transform: scale(0.99);
    }

    .copy-btn:disabled {
      opacity: 0.6;
      cursor: default;
      filter: none;
      transform: none;
    }

    .copy-btn:focus-visible,
    .address:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .copy-btn svg {
      width: 15px;
      height: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 11.5px;
      color: var(--text-dimmer);
    }

    .footer span {
      color: var(--text-dim);
    }

    @media (max-width:380px) {
      .device {
        padding: 22px 18px 20px;
      }

      .scan {
        width: 164px;
        height: 164px;
      }

      #qrcode {
        width: 132px;
        height: 132px;
      }
    }
  </style>
</head>

<body>

  <div class="stage">
    <div class="device">

      <div class="head">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="2" width="10" height="17" rx="2" stroke="#e3a24b" stroke-width="1.6" />
            <circle cx="12" cy="16" r="0.9" fill="#e3a24b" />
            <path d="M4 9.5C4 6.5 6 4 9 3" stroke="#5c5e66" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1>Slides Remote</h1>
          <p>Control your presentation from your phone</p>
        </div>
      </div>

      <div class="status-row">
        <div class="status-left">
          <span class="led" id="statusLed"></span>
          <span id="statusText">Checking...</span>
        </div>
        <span class="badge" id="badge" style="display:none">0 connected</span>
      </div>

      <p class="field-label" id="addressLabel" style="display:none">Connect at</p>
      <div class="address hidden" id="addressRow" tabindex="0" role="button" aria-label="Copy remote link">
        <code id="addressText">http://localhost:8765</code>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6" />
          <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.6" />
        </svg>
      </div>

      <div class="scan hidden" id="scanArea">
        <span class="scan-corner tl"></span>
        <span class="scan-corner tr"></span>
        <span class="scan-corner bl"></span>
        <span class="scan-corner br"></span>
        <div id="qrcode"></div>
      </div>
      <p class="scan-caption hidden" id="scanCaption">Scan with your phone's camera to open the remote</p>

      <button class="copy-btn hidden" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="btnIcon">
          <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8" />
          <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8" />
        </svg>
        <span id="btnLabel">Copy link</span>
      </button>

      <button class="copy-btn hidden" id="startBtn">
        <span id="startBtnLabel">Start Server</span>
      </button>

      <p id="message" style="margin-top: 10px; font-size: 12px; color: var(--error); text-align: center;"></p>

      <p class="footer">Made with ❤️<span>Yash</span></p>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
